[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veritas-rl"
version = "1.0.0"
description = "Frontier RLVR Post-Training & Distributed Parallelism Engine: GRPO/DAPO Verifiable-Reward RL, DoRA Weight Decomposition, Ring-Attention + Megatron 2D Parallelism & Native C++20 GAE/KL Kernels"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
  { name = "Nagarjuna Kamireddy", email = "sendemailtonagarjuna@gmail.com" }
]
dependencies = [
  "torch>=2.2.0",
  "numpy>=1.26.0",
  "pydantic>=2.9.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.27.0",
  "typer>=0.12.5",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.115.0",
  "mypy>=1.13.0",
  "ruff>=0.7.0",
]

[project.scripts]
veritas = "veritas_rl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/veritas_rl"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "N812", "B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
